[package]
name = "scout-vault"
version = "0.1.0"
description = "Token escrow for a wallet-signed field report with buyer review."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "scout_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", features = ["token", "associated_token"] }
